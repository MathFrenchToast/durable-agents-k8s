apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-auditor-config
  namespace: agent-lab
data:
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "providers": {
        "ollama": {
          "name": "Ollama Local GPU",
          "package": "@opencode/ai/providers/openai-compatible",
          "env": ["OLLAMA_API_KEY"],
          "settings": {
            "baseURL": "http://192.168.124.1:11434/v1",
            "apiKey": "ollama"
          },
          "models": {
            "qwen2.5:7b": {
              "name": "Qwen 2.5 7B",
              "limit": {
                "context": 65536,
                "output": 8192
              }
            },
            "gpt-oss:20b": {
              "id": "gpt-oss:20b-32k",
              "name": "GPT-OSS 20B (32k Context)",
              "limit": {
                "context": 32768,
                "output": 8192
              }
            },
            "gpt-oss:20b-32k": {
              "name": "GPT-OSS 20B (32k Context)",
              "limit": {
                "context": 32768,
                "output": 8192
              }
            }
          }
        }
      },
      "permissions": [
        {"action": "*", "resource": "*", "effect": "allow"},
        {"action": "skill", "resource": "*", "effect": "deny"}
      ]
    }
  AGENTS.md: |
    # Agent Engineering Standards
    - Working directory: `/data/workspace` (persistent Longhorn RWOP volume).
    - When creating or modifying TypeScript files under 250 lines, ALWAYS use the `write` tool to write the complete, self-contained file rather than partial `edit` patches that risk truncating lines.
    - Never import symbols in `*.test.ts` that are not explicitly exported by the implementation module.
    - Whenever you create or modify code, run `bun test` via the `shell` tool and fix any errors until `bun test` exits with code 0 (`0 fail`).
