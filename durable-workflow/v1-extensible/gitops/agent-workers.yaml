apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-workers
  namespace: agent-system
  labels:
    app: agent-workers
    app.kubernetes.io/component: worker-pool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-workers
  template:
    metadata:
      labels:
        app: agent-workers
    spec:
      containers:
        - name: worker
          image: agent-platform/agent-worker:v0.1
          imagePullPolicy: IfNotPresent
          env:
            - name: GATEWAY_URL
              value: "http://app-chapeau.agent-system.svc.cluster.local:8000"
            - name: RESTATE_ADMIN_URL
              value: "http://restate.agent-system.svc.cluster.local:9070"
          ports:
            - name: worker-port
              containerPort: 9080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: keda-agent-workers
  namespace: agent-system
spec:
  scaleTargetRef:
    name: agent-workers
  minReplicaCount: 1
  maxReplicaCount: 5
  cooldownPeriod: 30
  pollingInterval: 5
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prom-stack-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        metricName: restate_pending_invocations
        query: sum(restate_service_pending_invocations{service="GitHubIssueResolver"})
        threshold: "2"
